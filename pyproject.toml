[tool.pytest.ini_options]
testpaths = ["npc_app/tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["npc_app"]
branch = true
omit = ["npc_app/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"npc_app/main.py" = ["B008"]
"npc_app/services/auth_service.py" = ["B008"]
"npc_app/tests/**/*.py" = ["S101"]

[tool.setuptools.package-data]
npc_app = ["dialogue_config.json"]
