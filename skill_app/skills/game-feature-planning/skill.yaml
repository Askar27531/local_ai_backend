schema_version: 1
name: game-feature-planning
version: 1.0.0
kind: agent
status: draft
model:
  instruction: SKILL.md
  profile:
  output_schema: task_plan
agents:
  planner: planner
tools:
  allow:
    - read_project_file
    - read_file_range
    - search_project_text
data_policy:
  read: ["**/*"]
  write: []
  deny: ["**/*.db", "**/.env"]
limits:
  max_files: 1
  max_changed_lines: 1
  max_model_calls: 3
  tool_timeout_seconds: 60
validators:
  pre: []
  output: [structured_output]
  post: []
approval:
  plan_required: true
  delivery_required: false
retry:
  model_parse_attempts: 2
  tool_attempts: 0
  repair_attempts: 0
  backoff_seconds: [1, 3]
