schema_version: 1
name: lore-reviewer
version: 1.0.0
kind: agent
status: active
model:
  instruction: SKILL.md
  profile:
  output_schema: game_text_review_result
agents:
  reviewer: lore_reviewer
tools:
  allow:
    - read_project_file
    - read_file_range
    - search_project_text
data_policy:
  read: ["game_docs/**/*.md"]
  write: []
  deny: ["**/*.db", "**/.env"]
limits:
  max_files: 8
  max_changed_lines: 1200
  max_model_calls: 3
  tool_timeout_seconds: 60
validators:
  pre: [task_is_running, workspace_is_active]
  output: [structured_output]
  post: [semantic_review]
approval:
  delivery_required: false
retry:
  model_parse_attempts: 2
  tool_attempts: 0
  repair_attempts: 0
  backoff_seconds: [1, 3]
