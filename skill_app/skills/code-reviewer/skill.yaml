schema_version: 1
name: code-reviewer
version: 1.0.0
kind: agent
status: draft
model:
  instruction: SKILL.md
  profile:
  output_schema: semantic_review_result
agents:
  reviewer: review_agent
tools:
  allow:
    - read_project_file
    - read_file_range
    - create_unified_diff
data_policy:
  read: ["**/*.py"]
  write: []
  deny: ["**/*.db", "**/.env"]
limits:
  max_files: 5
  max_changed_lines: 1200
  max_model_calls: 3
  tool_timeout_seconds: 60
validators:
  pre: [task_is_running, workspace_is_active]
  output: [structured_output]
  post: [semantic_review]
approval:
  delivery_required: false
retry:
  model_parse_attempts: 2
  tool_attempts: 0
  repair_attempts: 0
  backoff_seconds: [1, 3]
