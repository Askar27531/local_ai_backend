schema_version: 1
name: test-generator
version: 1.0.0
kind: agent
status: draft
model:
  instruction: SKILL.md
  profile:
  output_schema: generated_test_suite
agents:
  tester: test_agent
tools:
  allow:
    - read_project_file
    - read_file_range
    - write_workspace_file
    - run_python_compile
    - run_pytest
data_policy:
  read: ["**/*.py"]
  write: ["**/test_*.py"]
  deny: ["**/*.db", "**/.env"]
limits:
  max_files: 1
  max_changed_lines: 300
  max_model_calls: 3
  tool_timeout_seconds: 180
validators:
  pre: [task_is_running, workspace_is_active]
  output: [structured_output]
  post: [python_compile, focused_pytest]
approval:
  delivery_required: false
retry:
  model_parse_attempts: 2
  tool_attempts: 1
  repair_attempts: 0
  backoff_seconds: [1, 3]
